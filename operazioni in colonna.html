<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operazioni in colonna - Maestro Luciano</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg-start: #81c784;
    --bg-end: #1b5e20;
    --card-bg: rgba(20, 45, 20, 0.80);
    --card-border: rgba(255, 255, 255, 0.22);
    --text: #f5f5dc;
    --text-bright: #ffffff;
    --accent: #ffb74d;
    --accent-hover: #ff9800;
    --correct: #66bb6a;
    --wrong: #ef5350;
    --d-unit: #82b1ff;
    --d-tens: #ff8a80;
    --d-hundreds: #a5f3c0;
    --d-thousands: #ffe082;
  }

  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Verdana', 'Tahoma', 'Segoe UI', sans-serif;
    font-size: 18px; line-height: 1.55; color: var(--text);
    letter-spacing: 0.4px;
  }
  body {
    background: linear-gradient(90deg, var(--bg-start) 0%, var(--bg-end) 100%);
    background-attachment: fixed;
    padding: 18px 14px;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }

  /* Contenitore principale: stessa larghezza per TUTTE le schermate */
  .screen {
    width: 100%; max-width: 1280px;
    display: none; flex-direction: column; gap: 16px;
  }
  .screen.active { display: flex; }
  #screen-quiz { max-width: 1280px; }
  #screen-help { max-width: 1280px; }
  #screen-welcome.active, #screen-menu.active {
    margin: auto 0; justify-content: center; align-items: center;
  }
  #screen-welcome .card, #screen-menu .card { width: 100%; }

  .card {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 26px; padding: 22px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }

  h1 { font-size: 1.7em; margin: 0 0 14px 0; color: var(--text-bright); text-align: center; letter-spacing: 0.6px; }
  h2 { font-size: 1.25em; margin: 0 0 10px 0; color: var(--text-bright); }
  p { margin: 8px 0; }

  input[type="text"], input[type="number"] {
    font-family: inherit; font-size: 1.4em; padding: 12px 16px;
    border-radius: 16px; border: 3px solid var(--accent);
    background: #fdfdf5; color: #1b5e20; text-align: center;
    width: 100%; max-width: 340px; margin: 10px auto; display: block; font-weight: bold;
  }
  input:focus { outline: 4px solid rgba(255,183,77,0.6); outline-offset: 2px; }

  button {
    font-family: inherit; font-size: 1.1em; padding: 14px 24px;
    border-radius: 18px; border: none; background: var(--accent);
    color: #1b3d1e; font-weight: bold; cursor: pointer;
    transition: transform 0.12s, background 0.15s; letter-spacing: 0.5px;
  }
  button:hover, button:focus-visible {
    background: var(--accent-hover); transform: translateY(-2px);
    outline: 3px solid #fff; outline-offset: 2px;
  }
  button:active { transform: translateY(0); }

  .back-btn {
    background: rgba(0,0,0,0.45); color: var(--text-bright);
    padding: 9px 16px; font-size: 0.95em;
    border: 2px solid rgba(255,255,255,0.25);
  }
  .back-btn:hover { background: rgba(0,0,0,0.65); }

  .ghost-btn {
    background: rgba(255,255,255,0.18); color: var(--text-bright);
    border: 2px solid rgba(255,255,255,0.35);
  }
  .ghost-btn:hover { background: rgba(255,255,255,0.3); }

  .op-menu {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px;
  }
  .op-btn {
    font-size: 1.5em; padding: 34px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: var(--accent); border-radius: 22px;
  }
  .op-btn .op-icon { font-size: 2.6em; line-height: 1; }

  /* Griglia cifre: 7 colonne → 14 tasti = due righe da 7, a tutta larghezza */
  .digit-row {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
    max-width: 100%;
    margin: 10px auto 0;
  }
  /* Altezza uniformata con i tasti delle opzioni */
  .digit-btn {
    min-width: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    font-size: 0.72em;
    background: rgba(255,255,255,0.14);
    color: var(--text-bright);
    border: 2px solid rgba(255,255,255,0.32);
    border-radius: 12px;
    line-height: 1.15;
    text-align: center;
  }
  .digit-btn.active {
    background: var(--accent); color: #1b3d1e; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,183,77,0.4);
  }

  /* Opzioni Cambio + Tipo numeri sulla stessa riga */
  .option-row {
    margin-top: 16px;
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px 28px;
    border-top: 2px dashed rgba(255,255,255,0.18);
    padding-top: 14px;
  }
  .option-group {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .option-label {
    font-size: 0.95em; color: var(--text-bright);
    font-weight: bold; min-width: 62px;
  }
  /* Stessa altezza dei tasti cifre */
  .opt-btn {
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 15px;
    font-size: 0.9em;
    border-radius: 14px;
    background: rgba(255,255,255,0.14); color: var(--text-bright);
    border: 2px solid rgba(255,255,255,0.32); cursor: pointer;
    line-height: 1.15;
    text-align: center;
  }
  .opt-btn:hover { background: rgba(255,255,255,0.28); }
  .opt-btn.active {
    background: var(--accent); color: #1b3d1e; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,183,77,0.4);
  }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
  }
  .greet-group {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .name-greet { font-size: 1.05em; color: var(--text-bright); font-weight: bold; }
  .help-btn {
    background: var(--accent); color: #1b3d1e;
    border: 2px solid var(--accent);
    padding: 9px 18px; font-size: 0.95em;
    border-radius: 14px; white-space: nowrap;
  }
  .help-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  .inline-op-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: nowrap;
    background: rgba(0,0,0,0.28);
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 16px; padding: 8px 10px 8px 18px;
    margin-bottom: 6px; min-height: 56px;
  }
  .inline-op-text {
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 1.4em; font-weight: bold; color: var(--text-bright);
    letter-spacing: 2px; white-space: nowrap;
    overflow-x: auto; overflow-y: hidden;
    flex: 1 1 auto; min-width: 0;
  }
  .inline-op-text .op-sym { color: var(--accent); padding: 0 2px; }
  .small-btn { font-size: 0.95em; padding: 9px 16px; border-radius: 14px; white-space: nowrap; flex: 0 0 auto; }

  .col-wrap { display: flex; justify-content: center; padding: 18px 4px 6px; overflow-x: auto; }

  table.col-table {
    border-collapse: separate; border-spacing: 5px 6px;
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 2.1em; font-weight: bold; color: #ffffff; margin: 0 auto;
  }
  table.col-table td { text-align: center; vertical-align: middle; padding: 0; }

  td.cell-digit {
    width: 54px; height: 54px; min-width: 54px;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 50%; box-shadow: inset 0 2px 6px rgba(0,0,0,0.22);
  }
  td.cell-digit .digit-char { display: inline-block; line-height: 50px; }

  /* Virgola visualizzata come pseudo-elemento senza colonna dedicata */
  td.comma-after { position: relative; }
  td.comma-after::after {
    content: ','; position: absolute; right: -8px; top: 50%;
    transform: translateY(-42%);
    color: #ffffff; font-size: 1.25em; font-weight: bold;
    line-height: 1; pointer-events: none; z-index: 2;
  }

  td.cell-answer {
    width: 54px; height: 54px; min-width: 54px;
    background: rgba(255,183,77,0.12);
    border: 2px solid rgba(255,183,77,0.55);
    border-radius: 50%; box-shadow: inset 0 2px 6px rgba(0,0,0,0.22);
    padding: 0; position: relative;
  }
  td.cell-answer input.digit-input {
    width: 100%; height: 100%; padding: 0; margin: 0;
    border: none; background: transparent; color: inherit;
    font-family: inherit; font-size: 1em; font-weight: bold;
    text-align: center; border-radius: 50%; outline: none;
    line-height: 1; display: block; max-width: none; box-sizing: border-box;
  }
  td.cell-answer input.digit-input:focus {
    background: rgba(255,183,77,0.32); box-shadow: 0 0 0 3px rgba(255,183,77,0.9);
  }
  td.cell-answer input.digit-input.wrong {
    background: rgba(239,83,80,0.55) !important;
    color: #ffebee !important;
    box-shadow: 0 0 0 3px rgba(239,83,80,0.9) !important;
  }

  td.cell-op {
    width: 54px; height: 54px; min-width: 54px;
    background: rgba(255,183,77,0.18);
    border: 2px solid rgba(255,183,77,0.70);
    border-radius: 50%; color: var(--accent); font-weight: bold; line-height: 50px;
  }
  td.cell-empty { width: 54px; height: 54px; min-width: 54px; }
  td.cell-sign {
    width: 34px; min-width: 34px; font-size: 1em; color: var(--text-bright);
    line-height: 54px; text-align: right;
  }
  td.cell-decimal {
    width: 22px; min-width: 22px; text-align: center;
    color: var(--text-bright); font-size: 1.6em; line-height: 54px;
  }
  td.cell-carry { height: 38px; min-width: 54px; width: 54px; padding: 0; }
  td.cell-borrow { height: 40px; min-width: 54px; width: 54px; padding: 0; }

  input.mini-input {
    font-family: inherit; font-size: 15px;
    width: 34px; height: 30px; padding: 0; margin: 0 auto;
    display: block; text-align: center; border-radius: 50%;
    border: 2px solid rgba(255,183,77,0.85);
    background: rgba(253,253,245,0.94);
    color: #1b5e20; font-weight: bold; line-height: 1;
  }
  input.mini-input.wide { width: 42px; border-radius: 14px; font-size: 14px; }
  input.mini-input:focus { outline: 3px solid rgba(255,183,77,0.75); outline-offset: 1px; }

  tr.line-row td { padding: 0 !important; height: 8px; }
  .line-inner {
    height: 5px; background: var(--text-bright);
    border-radius: 4px; margin: 6px 2px;
  }

  .d-unit { color: var(--d-unit); }
  .d-tens { color: var(--d-tens); }
  .d-hundreds { color: var(--d-hundreds); }
  .d-thousands { color: var(--d-thousands); }

  input.answer-input, input.partial-input {
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 0.72em; width: 100%; max-width: none;
    padding: 4px 6px; margin: 0; border-radius: 14px;
    background: #fdfdf5; color: #1b5e20; text-align: center;
    font-weight: bold; border: 3px solid var(--accent); height: 48px;
  }
  input.answer-input:focus, input.partial-input:focus {
    outline: 4px solid rgba(255,183,77,0.6); outline-offset: 1px;
  }

  .division-container {
    display: flex; justify-content: center; align-items: flex-start;
    gap: 0; padding: 22px 4px 10px;
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 1.7em; font-weight: bold; overflow-x: auto;
  }
  .div-left, .div-right { display: flex; flex-direction: column; gap: 0; }
  .div-vline {
    width: 4px; background: var(--text-bright);
    border-radius: 2px; align-self: stretch; margin: 0 14px;
  }
  .div-number {
    color: var(--text-bright); font-size: 1em;
    padding: 4px 10px; text-align: right; letter-spacing: 2px; min-height: 1.4em;
  }
  .div-step-row { padding: 2px 0; display: flex; justify-content: flex-end; }
  .div-digit-group { display: flex; gap: 3px; justify-content: flex-end; }
  .div-digit-group input {
    font-family: inherit; font-size: 0.78em;
    width: 1.5em; max-width: none; height: 1.9em;
    padding: 0; margin: 0; border-radius: 10px;
    border: 3px solid var(--accent);
    background: #fdfdf5; color: #1b5e20;
    text-align: center; font-weight: bold;
  }
  .div-digit-group input:focus { outline: 4px solid rgba(255,183,77,0.6); outline-offset: 1px; }
  .div-step-line {
    height: 4px; background: var(--text-bright);
    border-radius: 2px; margin: 4px 0;
  }
  .div-divisor { border-bottom: 4px solid var(--text-bright); padding-bottom: 6px; }
  .div-quotient { padding-top: 6px; }

  .div-quotient-row {
    display: flex; gap: 4px; padding-top: 8px;
    justify-content: flex-end; flex-wrap: nowrap;
  }
  .div-quotient-row input {
    font-family: inherit; font-size: 0.72em;
    width: 1.7em; max-width: none; height: 1.9em;
    padding: 0; margin: 0; border-radius: 10px;
    border: 3px solid var(--accent);
    background: #fdfdf5; color: #1b5e20;
    text-align: center; font-weight: bold;
  }
  .div-quotient-row input:focus { outline: 4px solid rgba(255,183,77,0.6); outline-offset: 1px; }
  .div-quotient-row input.wrong {
    border-color: var(--wrong) !important;
    background: #ffebee !important;
    box-shadow: 0 0 0 3px rgba(239,83,80,0.45) !important;
  }

  #feedback {
    text-align: center; font-size: 1.1em; font-weight: bold;
    padding: 14px; border-radius: 16px; min-height: 2em;
    transition: background 0.3s, border-color 0.3s;
    margin-top: 14px; line-height: 1.5;
  }
  #feedback.correct {
    background: rgba(102, 187, 106, 0.28);
    border: 2px solid var(--correct); color: #eaffea;
  }
  #feedback.wrong {
    background: rgba(239, 83, 80, 0.28);
    border: 2px solid var(--wrong); color: #ffebee;
  }
  #feedback.idle {
    background: rgba(0,0,0,0.22); color: var(--text);
    border: 2px solid rgba(255,255,255,0.15);
  }

  .actions {
    display: flex; gap: 12px; justify-content: center;
    flex-wrap: wrap; margin-top: 8px;
  }

  .legend {
    display: flex; justify-content: center; align-items: center;
    flex-wrap: wrap; gap: 22px; font-size: 0.95em;
    margin-top: 10px; color: var(--text);
  }
  .legend span::before {
    content: '●'; margin-right: 6px; font-size: 2.2em;
    line-height: 1; display: inline-block;
    vertical-align: middle; transform: translateY(-2px);
  }
  .legend .lu::before { color: var(--d-unit); }
  .legend .ld::before { color: var(--d-tens); }
  .legend .lc::before { color: var(--d-hundreds); }
  .legend .lk::before { color: var(--d-thousands); }

  input.wrong {
    border-color: var(--wrong) !important;
    background: #ffebee !important;
    box-shadow: 0 0 0 3px rgba(239,83,80,0.45) !important;
  }

  /* ===== Form della schermata iniziale, adeguati alla larghezza ===== */
  #name-input {
    max-width: 640px;
    font-size: 1.55em;
    padding: 16px 22px;
    border-radius: 18px;
  }
  #start-btn {
    font-size: 1.3em;
    padding: 18px 56px;
    border-radius: 20px;
  }

  /* ===== Finestra "Come si fa" ===== */
  #help-title { margin-bottom: 6px; }
  .help-sub {
    text-align: center; color: var(--accent); font-weight: bold;
    margin: 0 0 20px 0; font-size: 1.05em;
  }
  #help-content {
    column-count: 2;
    column-gap: 36px;
  }
  .help-section {
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    margin: 0 0 22px 0;
  }
  .help-section h2 {
    color: var(--accent);
    font-size: 1.12em;
    margin: 0 0 8px 0;
    padding-bottom: 5px;
    border-bottom: 2px solid rgba(255,255,255,0.18);
  }
  .help-section ul {
    margin: 0; padding-left: 24px;
  }
  .help-section li {
    margin: 7px 0; line-height: 1.5; font-size: 0.98em;
  }
  .help-section li strong { color: var(--text-bright); }
  .help-section li em {
    color: var(--accent); font-style: normal; font-weight: bold;
  }

  @media (max-width: 820px) {
    #help-content { column-count: 1; }
  }

  @media (max-width: 600px) {
    html, body { font-size: 16px; }
    .op-menu { grid-template-columns: 1fr; }
    table.col-table { font-size: 1.7em; border-spacing: 3px 4px; }
    td.cell-digit, td.cell-op, td.cell-empty, td.cell-answer {
      width: 42px; height: 42px; min-width: 42px;
    }
    td.cell-digit .digit-char, td.cell-op { line-height: 38px; }
    td.cell-carry, td.cell-borrow { min-width: 42px; width: 42px; }
    td.cell-decimal { min-width: 16px; width: 16px; font-size: 1.3em; line-height: 42px; }
    td.cell-sign { min-width: 26px; width: 26px; line-height: 42px; }
    input.mini-input { width: 28px; height: 26px; font-size: 13px; }
    input.mini-input.wide { width: 36px; font-size: 12px; }
    .card { padding: 16px; }
    h1 { font-size: 1.35em; }
    .op-btn { padding: 22px 12px; font-size: 1.25em; }
    .digit-row { max-width: 100%; gap: 5px; }
    .digit-btn { height: 38px; font-size: 0.68em; padding: 0 2px; }
    .opt-btn { height: 38px; font-size: 0.8em; padding: 0 10px; }
    .division-container { font-size: 1.3em; }
    input.answer-input, input.partial-input { height: 40px; }
    .div-quotient-row input { font-size: 0.68em; width: 1.55em; height: 1.75em; }
    .div-digit-group input { font-size: 0.74em; width: 1.45em; height: 1.75em; }
    .inline-op-bar { padding: 6px 8px 6px 12px; min-height: 48px; }
    .inline-op-text { font-size: 1.05em; letter-spacing: 1px; }
    .small-btn { font-size: 0.85em; padding: 7px 12px; }
    .legend span::before { font-size: 1.9em; }
    .option-row { gap: 10px 14px; }
    .option-label { min-width: 0; }
    #name-input { max-width: 100%; font-size: 1.3em; }
    #start-btn { font-size: 1.15em; padding: 16px 34px; }
    .greet-group { gap: 10px; }
    .help-btn { font-size: 0.85em; padding: 7px 12px; }
  }
</style>
</head>
<body>

<!-- ============ BENVENUTO ============ -->
<div id="screen-welcome" class="screen active">
  <div class="card">
    <h1>🧮 Operazioni in colonna</h1>
    <p style="text-align:center; font-size:1.15em;">Ciao! Come ti chiami?</p>
    <input type="text" id="name-input" placeholder="Scrivi il tuo nome" maxlength="20" autocomplete="off">
    <div style="text-align:center; margin-top: 14px;">
      <button id="start-btn">🚀 Iniziamo</button>
    </div>
  </div>
</div>

<!-- ============ MENU OPERAZIONI ============ -->
<div id="screen-menu" class="screen">
  <div class="card">
    <div class="top-bar">
      <span class="name-greet" id="greet-menu">Ciao!</span>
      <button class="back-btn" id="back-to-welcome">↩ Cambia nome</button>
    </div>
    <h1 style="margin-top: 14px;">Cosa vuoi allenare oggi?</h1>
    <div class="op-menu">
      <button class="op-btn" data-op="add"><span class="op-icon">➕</span><span>Addizione</span></button>
      <button class="op-btn" data-op="sub"><span class="op-icon">➖</span><span>Sottrazione</span></button>
      <button class="op-btn" data-op="mul"><span class="op-icon">✖️</span><span>Moltiplicazione</span></button>
      <button class="op-btn" data-op="div"><span class="op-icon">➗</span><span>Divisione</span></button>
    </div>
  </div>
</div>

<!-- ============ ESERCIZIO ============ -->
<div id="screen-quiz" class="screen">
  <div class="card">
    <div class="top-bar">
      <div class="greet-group">
        <span class="name-greet" id="greet-quiz">Ciao!</span>
        <button type="button" class="help-btn" id="help-btn">📘 Come si fa</button>
      </div>
      <button class="back-btn" id="back-to-menu">↩ Cambia operazione</button>
    </div>
  </div>

  <div class="card">
    <h2 id="op-title">Scegli la difficoltà</h2>
    <p id="digit-hint">Quante cifre deve avere il secondo numero?</p>
    <div class="digit-row" id="digit-row">
      <button class="digit-btn active" data-digits="1">1 cifra</button>
      <button class="digit-btn" data-digits="2">2 cifre</button>
      <button class="digit-btn" data-digits="3">3 cifre</button>
      <button class="digit-btn" data-digits="4">4 cifre</button>
      <button class="digit-btn" data-digits="5">5 cifre</button>
      <button class="digit-btn" data-digits="6">6 cifre</button>
      <button class="digit-btn" data-digits="7">7 cifre</button>
      <button class="digit-btn" data-digits="8">8 cifre</button>

  /* ============ UTILITÀ ============ */
  function $(id) { return document.getElementById(id); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function randomNumber(digits) {
    if (digits <= 1) return Math.floor(Math.random() * 10);
    const min = Math.pow(10, digits - 1);
    const max = Math.pow(10, digits) - 1;
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function randomNonZero(digits) {
    if (digits <= 1) return Math.floor(Math.random() * 9) + 1;
    return randomNumber(digits);
  }

  function digitClass(posFromRight) {
    if (posFromRight <= 0) return 'd-unit';
    if (posFromRight === 1) return 'd-tens';
    if (posFromRight === 2) return 'd-hundreds';
    return 'd-thousands';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  /* ============ NUMERI IN LETTERE (ITALIANO) ============ */
  function numberToItalianWords(n) {
    if (n === 0) return 'zero';
    const isNeg = n < 0;
    n = Math.abs(n);

    const units = ['', 'uno', 'due', 'tre', 'quattro', 'cinque', 'sei', 'sette', 'otto', 'nove',
                   'dieci', 'undici', 'dodici', 'tredici', 'quattordici', 'quindici', 'sedici',
                   'diciassette', 'diciotto', 'diciannove'];
    const tens = ['', '', 'venti', 'trenta', 'quaranta', 'cinquanta', 'sessanta', 'settanta', 'ottanta', 'novanta'];

    function under100(num) {
      if (num < 20) return units[num];
      const t = Math.floor(num / 10);
      const u = num % 10;
      if (u === 0) return tens[t];
      if (u === 1 || u === 8) return tens[t].slice(0, -1) + units[u];
      if (u === 3) return tens[t] + 'tré';
      return tens[t] + units[u];
    }

    function under1000(num) {
      if (num < 100) return under100(num);
      const h = Math.floor(num / 100);
      const r = num % 100;
      const prefix = (h === 1) ? 'cento' : units[h] + 'cento';
      return prefix + (r > 0 ? under100(r) : '');
    }

    const groups = [];
    let temp = n;
    while (temp > 0) { groups.push(temp % 1000); temp = Math.floor(temp / 1000); }

    const scaleNames = ['', 'mila', 'milioni', 'miliardi', 'bilioni', 'biliardi'];
    const parts = [];
    for (let i = groups.length - 1; i >= 0; i--) {
      const g = groups[i];
      if (g === 0) continue;
      if (i === 0) {
        parts.push(under1000(g));
      } else if (i === 1) {
        if (g === 1) parts.push('mille');
        else parts.push(under1000(g) + 'mila');
      } else {
        if (g === 1) parts.push('un ' + scaleNames[i].slice(0, -1));
        else parts.push(under1000(g) + ' ' + scaleNames[i]);
      }
    }
    let result = parts.join(' ');
    if (isNeg) result = 'meno ' + result;
    return result;
  }

  function numberToItalianWordsDecimal(num, decimals, sign) {
    const prefix = (sign === -1) ? 'meno ' : '';
    if (!decimals) return prefix + numberToItalianWords(num);
    const s = String(num).padStart(decimals + 1, '0');
    const intPart = s.slice(0, s.length - decimals);
    const decPart = s.slice(s.length - decimals);
    const intNum = parseInt(intPart, 10);
    const intWords = numberToItalianWords(intNum);
    let decWords;
    if (decPart[0] === '0') {
      decWords = decPart.split('').map(d => numberToItalianWords(parseInt(d, 10))).join(' ');
    } else {
      decWords = numberToItalianWords(parseInt(decPart, 10));
    }
    return prefix + intWords + ' virgola ' + decWords;
  }

  /* ============ VOCE ============ */
  function initVoices() {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.onvoiceschanged = function () {};

  }
  initVoices();

  function speak(text, rate) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'it-IT';
      u.rate = rate || 0.95;
      u.pitch = 1.05;
      const voices = window.speechSynthesis.getVoices();
      const itVoice = voices.find(v => v.lang && v.lang.toLowerCase().indexOf('it') === 0);
      if (itVoice) u.voice = itVoice;
      window.speechSynthesis.speak(u);
    } catch (e) { /* silenzioso */ }
  }

  /* ============ GENERAZIONE SENZA CAMBIO ============ */
  function generateNoCarryAddition(totalDigits) {
    let a = '', b = '';
    for (let i = 0; i < totalDigits; i++) {
      const s = Math.floor(Math.random() * 9);
      const da = Math.floor(Math.random() * (s + 1));
      const db = s - da;
      a += da;
      b += db;
    }
    if (a[0] === '0') a = '1' + a.slice(1);
    if (b[0] === '0') b = '1' + b.slice(1);
    return { a: parseInt(a, 10), b: parseInt(b, 10) };
  }

  function generateNoBorrowSubtraction(totalDigits) {
    for (let attempt = 0; attempt < 200; attempt++) {
      let a = '', b = '';
      for (let i = 0; i < totalDigits; i++) {
        const d1 = Math.floor(Math.random() * 10);
        const d2 = Math.floor(Math.random() * (d1 + 1));
        a += d1;
        b += d2;
      }
      if (a[0] === '0') a = '1' + a.slice(1);
      if (b[0] === '0') b = '1' + b.slice(1);
      const na = parseInt(a, 10);
      const nb = parseInt(b, 10);
      if (na > nb) return { a: na, b: nb };
    }
    return { a: 10, b: 1 };
  }

  /* ============ GENERAZIONE PROBLEMI ============ */
  function generateProblem() {
    const op = state.operation;
    const d = state.digits;
    const numType = state.numType;
    const dm = (op === 'add' || op === 'sub') ? (DECIMALS_BY_TYPE[numType] || 0) : 0;
    const scale = Math.pow(10, dm);

    let num1, num2, result;
    let sign1 = 1, sign2 = 1, resultSign = 1;

    let dec1 = 0, dec2 = 0, decR = 0;

    if (op === 'add') {
      if (state.carryMode === 'senza' && numType !== 'relativi') {
        const totalDigits = d + dm;
        const g = generateNoCarryAddition(totalDigits);
        num1 = g.a; num2 = g.b;
      } else {
        // Entrambi gli addendi hanno esattamente d + dm cifre
        num2 = randomNonZero(d + dm);
        num1 = randomNonZero(d + dm);
      }
      if (numType === 'relativi') {
        // Segni indipendenti: possibili misti (+/- e -/+)
        sign1 = Math.random() < 0.5 ? 1 : -1;
        sign2 = Math.random() < 0.5 ? 1 : -1;
        const real = sign1 * num1 + sign2 * num2;
        result = Math.abs(real);
        resultSign = real < 0 ? -1 : 1;
      } else {
        result = num1 + num2;
      }

    } else if (op === 'sub') {
      if (state.carryMode === 'senza' && numType !== 'relativi') {
        const totalDigits = d + dm;
        const g = generateNoBorrowSubtraction(totalDigits);
        num1 = g.a; num2 = g.b;
      } else {
        // Entrambi gli operandi hanno esattamente d + dm cifre.
        // Ci assicuriamo che num1 > num2 senza alterare il numero di cifre.
        num2 = randomNonZero(d + dm);
        num1 = randomNonZero(d + dm);
        if (num1 < num2) { const t = num1; num1 = num2; num2 = t; }
        if (num1 === num2) {
          const maxSame = Math.pow(10, d + dm) - 1;
          if (num1 < maxSame) {
            num1 += 1;
          } else {
            num2 -= 1;
          }
        }
      }
      if (numType === 'relativi') {
        // Segni indipendenti: possibili misti (+/- e -/+)
        sign1 = Math.random() < 0.5 ? 1 : -1;
        sign2 = Math.random() < 0.5 ? 1 : -1;
        const real = sign1 * num1 - sign2 * num2;
        result = Math.abs(real);
        resultSign = real < 0 ? -1 : 1;
      } else {
        result = num1 - num2;
      }

    } else if (op === 'mul') {
      // Entrambi i fattori hanno esattamente d cifre
      num2 = randomNonZero(d);
      num1 = randomNonZero(d);
      result = num1 * num2;
      if (numType === 'decimali') {
        dec1 = 1;
        dec2 = 1;
        decR = 2;
      }
      if (numType === 'relativi') {
        // Segni indipendenti sui due fattori
        sign1 = Math.random() < 0.5 ? 1 : -1;
        sign2 = Math.random() < 0.5 ? 1 : -1;
        resultSign = (sign1 === sign2) ? 1 : -1;
      }

    } else {
      const divDigits = Math.min(d, 3);
      num2 = randomNonZero(divDigits);
      const qDigits = Math.max(1, Math.min(d, 2));
      const quotient = randomNonZero(qDigits);
      num1 = num2 * quotient;
      result = quotient;
      if (numType === 'relativi') {
        // Segni indipendenti su dividendo e divisore
        sign1 = Math.random() < 0.5 ? 1 : -1;
        sign2 = Math.random() < 0.5 ? 1 : -1;
        resultSign = (sign1 === sign2) ? 1 : -1;
      }
    }

    state.problem = {
      num1, num2, result, op, decimals: dm,
      sign1, sign2, resultSign,
      decimals1: dec1, decimals2: dec2, decimalsR: decR
    };
  }

  /* ============ HELPER PER CELLE ============ */
  function digitCells(digitStr, len, dm, posFromRightFn, makeCell) {
    let html = '';
    const decPos = dm > 0 ? (len - dm) : -1;
    for (let i = 0; i < len; i++) {
      if (decPos >= 0 && i === decPos) {
        html += '<td class="cell-decimal">,</td>';
      }
      const posFromRight = len - 1 - i;
      const effPos = Math.max(0, posFromRight - dm);
      const cls = digitClass(effPos);
      html += makeCell(digitStr[i], i, cls);
    }
    return html;
  }

  /* ============ RENDERING ADDIZIONE ============ */
  function renderAddition() {
    const p = state.problem;
    const dm = p.decimals || 0;
    const s1 = String(p.num1);
    const s2 = String(p.num2);
    const sr = String(p.result);
    const len = Math.max(s1.length, s2.length, sr.length);

    const a = s1.padStart(len, '0');
    const b = s2.padStart(len, '0');

    const carryIn = new Array(len).fill(0);
    let carry = 0;
    for (let i = len - 1; i >= 0; i--) {
      carryIn[i] = carry;
      const sum = parseInt(a[i]) + parseInt(b[i]) + carry;
      carry = Math.floor(sum / 10);
    }
    p.carryIn = carryIn;
    p.len = len;
    p.a = a;
    p.b = b;

    const decPos = dm > 0 ? (len - dm) : -1;
    const hasSigns = (state.numType === 'relativi');
    const sign1 = p.sign1 === -1 ? '−' : '+';
    const sign2 = p.sign2 === -1 ? '−' : '+';
    const signR = p.resultSign === -1 ? '−' : '+';

    let html = '<table class="col-table"><tbody>';

    html += '<tr>';
    if (hasSigns) html += '<td class="cell-carry"></td>';
    for (let i = 0; i < len; i++) {
      if (decPos >= 0 && i === decPos) html += '<td class="cell-carry"></td>';
      html += '<td class="cell-carry"><input type="text" class="mini-input" data-role="carry" data-idx="' + i + '" maxlength="1" inputmode="numeric" autocomplete="off"></td>';
    }
    html += '<td class="cell-empty"></td>';
    html += '</tr>';

    html += '<tr>';
    if (hasSigns) html += '<td class="cell-sign">' + sign1 + '</td>';
    html += digitCells(a, len, dm, null, (ch, i, cls) =>
      '<td class="cell-digit"><span class="digit-char ' + cls + '">' + ch + '</span></td>');
    html += '<td class="cell-op">+</td>';
    html += '</tr>';

    html += '<tr>';
    if (hasSigns) html += '<td class="cell-sign">' + sign2 + '</td>';
    html += digitCells(b, len, dm, null, (ch, i, cls) =>
      '<td class="cell-digit"><span class="digit-char ' + cls + '">' + ch + '</span></td>');
    html += '<td class="cell-op">=</td>';
    html += '</tr>';

    const totalCols = (hasSigns ? 1 : 0) + len + (dm > 0 ? 1 : 0) + 1;
    html += '<tr class="line-row"><td colspan="' + totalCols + '"><div class="line-inner"></div></td></tr>';

    html += '<tr>';
    if (hasSigns) html += '<td class="cell-sign">' + signR + '</td>';
    html += digitCells('0'.repeat(len), len, dm, null, (ch, i, cls) =>
      '<td class="cell-answer ' + cls + '"><input type="text" class="digit-input" data-role="result" data-idx="' + i + '" maxlength="1" inputmode="numeric" autocomplete="off" aria-label="Cifra risultato"></td>');
    html += '<td class="cell-empty"></td>';
    html += '</tr>';

    html += '</tbody></table>';
    return html;
  }

  /* ============ RENDERING SOTTRAZIONE ============ */
  function renderSubtraction() {
    const p = state.problem;
    const dm = p.decimals || 0;
    const s1 = String(p.num1);
    const len = Math.max(s1.length, String(p.num2).length, String(p.result).length);
    const a = s1.padStart(len, '0');
    const b = String(p.num2).padStart(len, '0');

    const afterBorrow = a.split('').map(Number);
    for (let i = len - 1; i >= 0; i--) {
      if (afterBorrow[i] < parseInt(b[i])) {
        afterBorrow[i] += 10;
        let j = i - 1;
        while (j >= 0 && afterBorrow[j] === 0) {
          afterBorrow[j] = 9;
          j--;
        }
        if (j >= 0) afterBorrow[j] -= 1;
      }
    }

    const borrows = [];
    for (let i = 0; i < len; i++) {
      const orig = parseInt(a[i]);
      borrows[i] = (afterBorrow[i] !== orig) ? afterBorrow[i] : null;
    }
    p.borrows = borrows;
    p.len = len;
    p.a = a;
    p.b = b;
    p.afterBorrow = afterBorrow;

    const decPos = dm > 0 ? (len - dm) : -1;
    const hasSigns = (state.numType === 'relativi');
    const sign1 = p.sign1 === -1 ? '−' : '+';
    const sign2 = p.sign2 === -1 ? '−' : '+';
    const signR = p.resultSign === -1 ? '−' : '+';

    let html = '<table class="col-table"><tbody>';

    html += '<tr>';
    if (hasSigns) html += '<td class="cell-borrow"></td>';
    for (let i = 0; i < len; i++) {
      if (decPos >= 0 && i === decPos) html += '<td class="cell-borrow"></td>';
      const need = borrows[i] !== null;
      const ml = need && String(borrows[i]).length > 1 ? ' wide' : '';
      html += '<td class="cell-borrow"><input type="text" class="mini-input' + ml + '" data-role="borrow" data-idx="' + i + '" maxlength="2" inputmode="numeric" autocomplete="off"></td>';
    }
    html += '<td class="cell-empty"></td>';
    html += '</tr>';

    html += '<tr>';
    if (hasSigns) html += '<td class="cell-sign">' + sign1 + '</td>';
    html += digitCells(a, len, dm, null, (ch, i, cls) =>
      '<td class="cell-digit"><span class="digit-char ' + cls + '">' + ch + '</span></td>');
    html += '<td class="cell-op">−</td>';
    html += '</tr>';

    html += '<tr>';
    if (hasSigns) html += '<td class="cell-sign">' + sign2 + '</td>';
    html += digitCells(b, len, dm, null, (ch, i, cls) =>
      '<td class="cell-digit"><span class="digit-char ' + cls + '">' + ch + '</span></td>');
    html += '<td class="cell-op">=</td>';
    html += '</tr>';

    const totalCols = (hasSigns ? 1 : 0) + len + (dm > 0 ? 1 : 0) + 1;
    html += '<tr class="line-row"><td colspan="' + totalCols + '"><div class="line-inner"></div></td></tr>';

    html += '<tr>';
    if (hasSigns) html += '<td class="cell-sign">' + signR + '</td>';
    html += digitCells('0'.repeat(len), len, dm, null, (ch, i, cls) =>
      '<td class="cell-answer ' + cls + '"><input type="text" class="digit-input" data-role="result" data-idx="' + i + '" maxlength="1" inputmode="numeric" autocomplete="off" aria-label="Cifra risultato"></td>');
    html += '<td class="cell-empty"></td>';
    html += '</tr>';

    html += '</tbody></table>';
    return html;
  }

  /* ============ RENDERING MOLTIPLICAZIONE ============ */
  function renderMultiplication() {
    const p = state.problem;
    const dec1 = p.decimals1 || 0;
    const dec2 = p.decimals2 || 0;

    // Padding con zeri iniziali per far vedere le virgole dei fattori
    // Es. num2 = 7 con dec2 = 1 → "07" → visualizzato "0,7"
    let s1 = String(p.num1);
    let s2 = String(p.num2);
    if (dec1 > 0) s1 = s1.padStart(dec1 + 1, '0');
    if (dec2 > 0) s2 = s2.padStart(dec2 + 1, '0');

    const len1 = s1.length;
    const len2 = s2.length;
    const nCols = len1 + len2;
    const totalCols = nCols + 1;
    const decR = p.decimalsR || 0;

    // Lunghezza degli zeri di padding inseriti per rappresentare la parte intera
    // (es. 0,5 → s2 = "05", paddingLen = 1). Serve per non saltare il prodotto
    // parziale che, pur essendo 0, deriva da uno zero "strutturale" del moltiplicatore.
    const paddingLen = s2.length - String(p.num2).length;

    const partials = [];
    for (let i = 0; i < len2; i++) {
      const d = parseInt(s2[len2 - 1 - i]);
      const prod = p.num1 * d;
      partials.push({ digit: d, product: prod, prodStr: String(prod), shift: i });
    }

    const firstD = partials[0].digit;
    const carryInto = new Array(len1).fill(0);
    let carry = 0;
    for (let i = len1 - 1; i >= 0; i--) {
      carryInto[i] = carry;
      const prod = parseInt(s1[i]) * firstD + carry;
      carry = Math.floor(prod / 10);
    }

    p.partials = partials;
    p.len1 = len1;
    p.len2 = len2;
    p.nCols = nCols;
    p.carryInto = carryInto;

    const num1StartCol = nCols - len1;
    const hasSigns = (state.numType === 'relativi');
    const sign1 = p.sign1 === -1 ? '−' : '+';
    const signR = p.resultSign === -1 ? '−' : '+';

    let html = '<table class="col-table"><tbody>';

    html += '<tr>';
    if (hasSigns) html += '<td class="cell-carry"></td>';
    for (let i = 0; i < nCols; i++) {
      if (i >= num1StartCol) {
        const posFromRightNum1 = len1 - 1 - (i - num1StartCol);
        html += '<td class="cell-carry"><input type="text" class="mini-input" data-role="carry" data-idx="' + posFromRightNum1 + '" maxlength="1" inputmode="numeric" autocomplete="off"></td>';
      } else {
        html += '<td class="cell-carry"></td>';
      }
    }
    html += '<td class="cell-empty"></td>';
    html += '</tr>';

    // Riga del primo fattore (con virgola visibile)
    html += '<tr>';
    if (hasSigns) html += '<td class="cell-sign">' + sign1 + '</td>';
    for (let i = 0; i < nCols; i++) {
      if (i >= num1StartCol) {
        const posFromRight = nCols - 1 - i;
        const digit = s1[i - num1StartCol];
        const commaAfter = (dec1 > 0 && posFromRight === dec1) ? ' comma-after' : '';
        html += '<td class="cell-digit' + commaAfter + '"><span class="digit-char ' + digitClass(posFromRight) + '">' + digit + '</span></td>';
      } else {
        html += '<td class="cell-empty"></td>';
      }
    }
    html += '<td class="cell-op">×</td>';
    html += '</tr>';

    // Riga del secondo fattore (con virgola visibile)
    html += '<tr>';
    if (hasSigns) html += '<td class="cell-sign"></td>';
    for (let i = 0; i < nCols; i++) {
      const posFromRight = nCols - 1 - i;
      if (posFromRight < len2) {
        const digit = s2[len2 - 1 - posFromRight];
        const commaAfter = (dec2 > 0 && posFromRight === dec2) ? ' comma-after' : '';
        html += '<td class="cell-digit' + commaAfter + '"><span class="digit-char ' + digitClass(posFromRight) + '">' + digit + '</span></td>';
      } else {
        html += '<td class="cell-empty"></td>';
      }
    }
    html += '<td class="cell-op">=</td>';
    html += '</tr>';

    html += '<tr class="line-row"><td colspan="' + ((hasSigns ? 1 : 0) + totalCols) + '"><div class="line-inner"></div></td></tr>';

    if (len2 > 1) {
      let anyPartial = false;
      for (let i = 0; i < partials.length; i++) {
        const pp = partials[i];
        // Indice della cifra del moltiplicatore che origina questo parziale
        const s2Idx = len2 - 1 - i;
        // Vero se lo zero è uno zero di padding decimale (es. "0" in "0,5")
        const isPaddedZero = (s2Idx < paddingLen);
        // Salta i parziali nulli solo se derivano da uno zero "reale" del numero
        // (es. lo zero di 50). Mantiene invece il parziale nullo quando è
        // prodotto da uno zero di padding decimale (es. 23 × 0,5).
        if (pp.digit === 0 && !isPaddedZero) continue;
        anyPartial = true;

        const lenP = pp.prodStr.length;
        const endCol = nCols - i - 1;
        const startCol = endCol - lenP + 1;

        html += '<tr>';
        if (hasSigns) html += '<td class="cell-sign"></td>';
        for (let col = 0; col < nCols; col++) {
          if (col >= startCol && col <= endCol) {
            const digitIdx = col - startCol;
            const posFromRight = nCols - 1 - col;
            html += '<td class="cell-answer ' + digitClass(posFromRight) + '"><input type="text" class="digit-input" data-role="partial" data-idx="' + i + '" data-pos="' + digitIdx + '" maxlength="1" inputmode="numeric" autocomplete="off" aria-label="Cifra prodotto parziale"></td>';
          } else {
            html += '<td class="cell-empty"></td>';
          }
        }
        html += '<td class="cell-empty"></td>';
        html += '</tr>';
      }

      if (anyPartial) {
        html += '<tr class="line-row"><td colspan="' + ((hasSigns ? 1 : 0) + totalCols) + '"><div class="line-inner"></div></td></tr>';
      }
    }

    html += '<tr>';
    if (hasSigns) html += '<td class="cell-sign">' + signR + '</td>';
    for (let i = 0; i < nCols; i++) {
      const posFromRight = nCols - 1 - i;
      const commaAfter = (decR > 0 && posFromRight === decR) ? ' comma-after' : '';
      html += '<td class="cell-answer ' + digitClass(posFromRight) + commaAfter + '"><input type="text" class="digit-input" data-role="result" data-idx="' + i + '" maxlength="1" inputmode="numeric" autocomplete="off" aria-label="Cifra risultato"></td>';
    }
    html += '<td class="cell-empty"></td>';
    html += '</tr>';

    html += '</tbody></table>';
    return html;
  }

  /* ============ RENDERING DIVISIONE ============ */
  function renderDivision() {
    const p = state.problem;
    const dividend = p.num1;
    const divisor = p.num2;

    const dividendStr = String(dividend);
    const steps = [];
    let current = 0;
    let quotientStr = '';
    for (let i = 0; i < dividendStr.length; i++) {
      current = current * 10 + parseInt(dividendStr[i]);
      if (current < divisor && quotientStr.length === 0) continue;
      const q = Math.floor(current / divisor);
      const prod = q * divisor;
      const newRem = current - prod;
      steps.push({
        partialDividend: current,
        product: prod,
        remainder: newRem,
        quotientDigit: q,
        idx: i
      });
      quotientStr += q;
      current = newRem;
    }

    for (let i = 0; i < steps.length; i++) {
      if (i < steps.length - 1) {
        const nextIdx = steps[i + 1].idx;
        const brought = steps[i].remainder * 10 + parseInt(dividendStr[nextIdx]);
        steps[i].post = brought;
      } else {
        steps[i].post = steps[i].remainder;
      }
    }

    p.steps = steps;
    p.quotient = quotientStr;

    const hasSigns = (state.numType === 'relativi');
    const sign1 = p.sign1 === -1 ? '−' : '+';
    const sign2 = p.sign2 === -1 ? '−' : '+';

    let html = '<div class="division-container">';
    html += '<div class="div-left">';
    html += '<div class="div-number">' + (hasSigns ? sign1 : '') + dividend + '</div>';

    for (let i = 0; i < steps.length; i++) {
      const prodStr = String(steps[i].product);
      html += '<div class="div-step-row"><div class="div-digit-group">';
      for (let k = 0; k < prodStr.length; k++) {
        html += '<input type="text" data-role="prod" data-idx="' + i + '" data-pos="' + k + '" maxlength="1" inputmode="numeric" autocomplete="off" aria-label="Cifra prodotto">';
      }
      html += '</div></div>';

      html += '<div class="div-step-line"></div>';

      const postStr = String(steps[i].post);
      html += '<div class="div-step-row"><div class="div-digit-group">';
      for (let k = 0; k < postStr.length; k++) {
        html += '<input type="text" data-role="post" data-idx="' + i + '" data-pos="' + k + '" maxlength="1" inputmode="numeric" autocomplete="off" aria-label="Cifra resto">';
      }
      html += '</div></div>';
    }
    html += '</div>';

    html += '<div class="div-vline"></div>';

    html += '<div class="div-right">';
    html += '<div class="div-number div-divisor">' + (hasSigns ? sign2 : '') + divisor + '</div>';
    html += '<div class="div-quotient-row">';
    for (let i = 0; i < quotientStr.length; i++) {
      html += '<input type="text" data-role="quotient" data-idx="' + i + '" maxlength="1" inputmode="numeric" autocomplete="off" aria-label="Cifra quoziente">';
    }
    html += '</div>';
    html += '</div>';

    html += '</div>';
    return html;
  }

  /* ============ RENDER PRINCIPALE ============ */
  function renderProblem() {
    const p = state.problem;
    const container = $('op-display');
    if (!p) { container.innerHTML = ''; return; }

    const inlineEl = $('inline-op-text');
    if (inlineEl) {
      const showPlus = (state.numType === 'relativi');
      let s1, s2;
      if (p.op === 'mul' && p.decimalsR > 0) {
        s1 = formatNumberForDisplay(p.num1, p.sign1, 1, showPlus);
        s2 = formatNumberForDisplay(p.num2, p.sign2, 1, showPlus);
      } else {
        s1 = formatNumberForDisplay(p.num1, p.sign1, p.decimals, showPlus);
        s2 = formatNumberForDisplay(p.num2, p.sign2, p.decimals, showPlus);
      }
      inlineEl.innerHTML = s1 + ' <span class="op-sym">' + OP_SYM[p.op] + '</span> ' + s2 + ' = ?';
    }

    let html = '';
    if (p.op === 'add') html = renderAddition();
    else if (p.op === 'sub') html = renderSubtraction();
    else if (p.op === 'mul') html = renderMultiplication();
    else html = renderDivision();

    container.innerHTML = html;

    setTimeout(() => {
      const firstInput = container.querySelector('input:not([readonly])');
      if (firstInput) firstInput.focus();

      container.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); }
        });
      });
    }, 60);

    const fb = $('feedback');
    fb.className = 'idle';
    fb.innerHTML = 'Inserisci il risultato e premi <strong>Verifica</strong>.';
  }

  function formatNumberForDisplay(num, sign, dm, showPlus) {
    let signStr = '';
    if (sign === -1) signStr = '−';
    else if (showPlus) signStr = '+';
    if (!dm) {
      return signStr + num;
    }
    const s = String(num).padStart(dm + 1, '0');
    const intPart = s.slice(0, s.length - dm) || '0';
    const decPart = s.slice(s.length - dm);
    return signStr + intPart + ',' + decPart;
  }

  /* ============ PULIZIA ERRORI ============ */
  function clearWrong() {
    document.querySelectorAll('input.wrong').forEach(i => i.classList.remove('wrong'));
  }

  /* ============ CONTROLLO RIGA DI CIFRE ============ */
  function checkDigitRow(role, expectedNum, len, errors, label, allowLeadingEmpty) {
    const expStr = String(expectedNum).padStart(len, '0');
    let firstNZ = 0;
    if (allowLeadingEmpty) {
      firstNZ = expStr.length;
      for (let i = 0; i < expStr.length; i++) {
        if (expStr[i] !== '0') { firstNZ = i; break; }
      }
      if (firstNZ === expStr.length) firstNZ = expStr.length - 1;
    }
    for (let i = 0; i < len; i++) {
      const inp = document.querySelector('[data-role="' + role + '"][data-idx="' + i + '"]');
      if (!inp) continue;
      const val = (inp.value || '').trim();
      const expDigit = expStr[i];
      if (i < firstNZ) {
        if (val !== '' && val !== '0') {
          inp.classList.add('wrong');
          errors.push(label);
        }
      } else {
        if (val !== expDigit) {
          inp.classList.add('wrong');
          errors.push(label);
        }
      }
    }
  }

  /* ============ VERIFICHE ============ */
  function checkAddition() {
    const p = state.problem;
    const errors = [];
    checkDigitRow('result', p.result, p.len, errors, 'risultato', true);
    return errors;
  }

  function checkSubtraction() {
    const p = state.problem;
    const errors = [];
    checkDigitRow('result', p.result, p.len, errors, 'risultato', true);
    return errors;
  }

  function checkMultiplication() {
    const p = state.problem;
    const errors = [];
    checkDigitRow('result', p.result, p.nCols, errors, 'risultato', true);
    return errors;
  }

  function checkDivision() {
    const p = state.problem;
    const errors = [];
    for (let i = 0; i < p.steps.length; i++) {
      const inp = document.querySelector('[data-role="quotient"][data-idx="' + i + '"]');
      if (!inp) continue;
      const val = (inp.value || '').trim();
      const expDigit = String(p.steps[i].quotientDigit);
      if (val !== expDigit) { inp.classList.add('wrong'); errors.push('quoziente'); }
    }
    return errors;
  }

  function checkAnswer() {
    if (!state.problem) return;
    clearWrong();
    const fb = $('feedback');

    let errors = [];
    if (state.problem.op === 'add') errors = checkAddition();
    else if (state.problem.op === 'sub') errors = checkSubtraction();
    else if (state.problem.op === 'mul') errors = checkMultiplication();
    else errors = checkDivision();

    if (errors.length === 0) {
      const msg = pick(PRAISE).replace('{name}', state.name || 'amico');
      fb.className = 'correct';
      const risultato = formatResultDisplay(state.problem);
      fb.innerHTML = '🎉 ' + escapeHtml(msg) + '<br>Tutto corretto! Il risultato è <strong>' + risultato + '</strong>.';
      speak(msg);
    } else {
      const msg = pick(ENCOURAGE).replace('{name}', state.name || 'amico');
      const dettaglio = 'Controlla: ' + errors.join(', ') + '.';
      const risultato = formatResultDisplay(state.problem);
      fb.className = 'wrong';
      fb.innerHTML = '❌ ' + escapeHtml(msg) + '<br>' + escapeHtml(dettaglio) + '<br>Il risultato giusto è <strong>' + risultato + '</strong>.';
      speak(msg);
    }
  }

  function formatResultDisplay(p) {
    const showPlus = (state.numType === 'relativi');
    if (p.op === 'mul' && p.decimalsR > 0) {
      return formatNumberForDisplay(p.result, p.resultSign, p.decimalsR, showPlus);
    }
    return formatNumberForDisplay(p.result, p.resultSign, p.decimals, showPlus);
  }

  /* ============ LETTURA DEL RISULTATO ============ */
  function readStudentResult() {
    const p = state.problem;
    if (!p) return null;
    const role = (p.op === 'div') ? 'quotient' : 'result';
    const inputs = document.querySelectorAll('[data-role="' + role + '"]');
    if (!inputs.length) return null;

    let digits = '';
    let anyFilled = false;
    inputs.forEach(inp => {
      const v = (inp.value || '').trim();
      if (v !== '') anyFilled = true;
      digits += /^\d$/.test(v) ? v : '0';
    });

    if (!anyFilled) return null;
    const num = parseInt(digits, 10);
    return isNaN(num) ? null : num;
  }

  /* ============ VOCE: OPERAZIONI ============ */
  function speakInlineOperation() {
    if (!state.problem) return;
    const p = state.problem;
    const dec1 = (p.op === 'mul' && p.decimalsR > 0) ? 1 : p.decimals;
    const s1 = numberToItalianWordsDecimal(p.num1, dec1, p.sign1);
    const s2 = numberToItalianWordsDecimal(p.num2, dec1, p.sign2);
    const testo = s1 + ' ' + OP_VERB[p.op] + ' ' + s2 + ' uguale. Quanto fa?';
    speak(testo, 0.9);
  }

  function speakFullOperation() {
    if (!state.problem) return;
    const p = state.problem;
    const dec1 = (p.op === 'mul' && p.decimalsR > 0) ? 1 : p.decimals;
    const s1 = numberToItalianWordsDecimal(p.num1, dec1, p.sign1);
    const s2 = numberToItalianWordsDecimal(p.num2, dec1, p.sign2);
    let testo = s1 + ' ' + OP_VERB[p.op] + ' ' + s2 + ' uguale';
    const res = readStudentResult();
    if (res !== null) {
      if (p.op === 'div') {
        testo += ' ' + numberToItalianWords(res);
      } else {
        const decR = (p.op === 'mul' && p.decimalsR > 0) ? p.decimalsR : p.decimals;
        testo += ' ' + numberToItalianWordsDecimal(res, decR, 1);
      }
    } else {
      testo += ' ... quanto fa?';
    }
    speak(testo, 0.9);
  }

  /* ============ AGGIORNAMENTO PULSANTI DIFFICOLTÀ ============ */
  function updateDigitButtons() {
    const maxDigits = MAX_DIGITS[state.operation] || 4;
    if (state.digits > maxDigits) state.digits = maxDigits;
    document.querySelectorAll('.digit-btn').forEach(b => {
      const d = parseInt(b.dataset.digits, 10);
      b.style.display = (d <= maxDigits) ? '' : 'none';
      b.classList.toggle('active', d === state.digits);
    });
  }

  /* ============ GESTIONE OPZIONI ============ */
  function updateOptionVisibility() {
    const op = state.operation;
    const carryGroup = $('group-carry');
    const typeGroup = $('group-type');
    if (carryGroup) carryGroup.style.display = (op === 'div') ? 'none' : '';
    if (typeGroup) typeGroup.style.display = (op === 'div') ? 'none' : '';

    if (op === 'div' && state.numType !== 'interi') {
      state.numType = 'interi';
      document.querySelectorAll('.opt-btn[data-opt="type"]').forEach(b => {
        b.classList.toggle('active', b.dataset.val === 'interi');
      });
    }
  }

  function updateCarryLabel() {
    const group = $('group-carry');
    if (!group) return;
    const label = group.querySelector('.option-label');
    const btnCon = group.querySelector('.opt-btn[data-val="con"]');
    const btnSenza = group.querySelector('.opt-btn[data-val="senza"]');
    if (!label || !btnCon || !btnSenza) return;
    if (state.operation === 'sub') {
      label.textContent = 'Prestito:';
      btnCon.textContent = 'Con prestito';
      btnSenza.textContent = 'Senza prestito';
    } else {
      label.textContent = 'Cambio:';
      btnCon.textContent = 'Con cambio';
      btnSenza.textContent = 'Senza cambio';
    }
  }

  /* ============ RESET OPZIONI ============ */
  function resetOptionsToSimplest() {
    state.digits = 1;
    state.carryMode = 'con';
    state.numType = 'interi';
    document.querySelectorAll('.opt-btn').forEach(b => {
      const opt = b.dataset.opt;
      const val = b.dataset.val;
      const shouldBeActive =
        (opt === 'carry' && val === 'con') ||
        (opt === 'type' && val === 'interi');
      b.classList.toggle('active', shouldBeActive);
    });
    document.querySelectorAll('.digit-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.digits, 10) === 1);
    });
  }

  /* ============ AVVIO OPERAZIONE ============ */
  function startOperation(op) {
    state.operation = op;
    resetOptionsToSimplest();
    updateDigitButtons();
    updateOptionVisibility();
    updateCarryLabel();

    $('op-title').textContent = OP_LABEL[op] + ': scegli la difficoltà';
    const termine = OP_SECOND_TERM[op] || 'il secondo numero';
    if (op === 'div') {
      $('digit-hint').textContent = 'Quante cifre deve avere il divisore? (max 3)';
    } else if (op === 'mul') {
      $('digit-hint').textContent = 'Quante cifre deve avere il moltiplicatore? (max 4)';
    } else {
      $('digit-hint').textContent = 'Quante cifre deve avere ' + termine + '? (max 14)';
    }

    updateGreet();
    showScreen('quiz');
    newProblem();
  }

  function newProblem() {
    generateProblem();
    renderProblem();
  }

  /* ============ GREETING ============ */
  function updateGreet() {
    const nome = state.name || 'amico';
    $('greet-menu').textContent = 'Ciao, ' + nome + '!';
    $('greet-quiz').textContent = 'Ciao, ' + nome + '!';
  }

  /* ============ FINESTRA "COME SI FA" ============ */
  function openHelp() {
    const op = state.operation;
    const data = HELP_CONTENT[op];
    if (!data) return;

    $('help-title').textContent = data.title;
    $('help-sub').textContent = data.sub || '';

    let html = '';
    data.sections.forEach(sec => {
      html += '<div class="help-section">';
      html += '<h2>' + sec.h + '</h2>';
      html += '<ul>';
      sec.items.forEach(it => { html += '<li>' + it + '</li>'; });
      html += '</ul>';
      html += '</div>';
    });
    $('help-content').innerHTML = html;

    showScreen('help');
    window.scrollTo(0, 0);
  }

  /* ============ EVENTI ============ */
  document.addEventListener('DOMContentLoaded', () => {

    $('start-btn').addEventListener('click', () => {
      const n = ($('name-input').value || '').trim();
      if (!n) {
        $('name-input').focus();
        speak('Scrivi il tuo nome per iniziare!');
        return;
      }
      state.name = n;
      updateGreet();
      showScreen('menu');
      speak('Ciao ' + n + "! Scegli l'operazione che vuoi allenare.", 0.95);
    });
    $('name-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); $('start-btn').click(); }
    });

    $('back-to-welcome').addEventListener('click', () => {
      showScreen('welcome');
      $('name-input').focus();
    });

    document.querySelectorAll('.op-btn').forEach(btn => {
      btn.addEventListener('click', () => startOperation(btn.dataset.op));
    });

    $('back-to-menu').addEventListener('click', () => showScreen('menu'));

    $('help-btn').addEventListener('click', openHelp);
    $('help-back-btn').addEventListener('click', () => {
      showScreen('quiz');
      window.scrollTo(0, 0);
    });

    document.querySelectorAll('.digit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = parseInt(btn.dataset.digits, 10);
        const maxDigits = MAX_DIGITS[state.operation] || 4;
        if (d > maxDigits) return;
        state.digits = d;
        document.querySelectorAll('.digit-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        newProblem();
      });
    });

    document.querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const opt = btn.dataset.opt;
        const val = btn.dataset.val;
        document.querySelectorAll('.opt-btn[data-opt="' + opt + '"]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (opt === 'carry') state.carryMode = val;
        else if (opt === 'type') state.numType = val;
        newProblem();
      });
    });

    $('check-btn').addEventListener('click', checkAnswer);
    $('new-btn').addEventListener('click', newProblem);
    $('speak-btn').addEventListener('click', speakFullOperation);
    $('speak-inline-btn').addEventListener('click', speakInlineOperation);

    $('name-input').focus();
  });

})();
</script>
</body>
</html>
